name: Main Branch Merge Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-main-merged:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
      
      - name: Fetch main branch
        run: |
          git fetch origin main:main
      
      - name: Check if main is merged into current branch
        run: |
          # Get commits in main that are not in the current branch
          MISSING_COMMITS=$(git log HEAD..main --oneline)
          
          if [ -n "$MISSING_COMMITS" ]; then
            echo "❌ ERROR: The following commits from 'main' are not in this branch:"
            echo ""
            git log HEAD..main --oneline --decorate
            echo ""
            echo "Please merge or rebase 'main' into your branch before merging."
            exit 1
          else
            echo "✅ SUCCESS: All commits from 'main' are present in this branch."
            exit 0
          fi

      - name: Check frontend submodules are on latest main
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          set -euo pipefail

          if [ ! -f .gitmodules ]; then
            echo "ℹ️ No .gitmodules file found; skipping submodule freshness check."
            exit 0
          fi

          FRONTEND_ENTRIES="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '$2 ~ /^front\/apps\/[^/]+$/')"
          if [ -z "$FRONTEND_ENTRIES" ]; then
            echo "ℹ️ No front/apps/<frontend_name> submodules found; skipping check."
            exit 0
          fi

          CHECK_FAILED=0

          while read -r SUBMODULE_PATH_KEY SUBMODULE_PATH; do
            [ -n "$SUBMODULE_PATH" ] || continue

            SUBMODULE_NAME="${SUBMODULE_PATH_KEY#submodule.}"
            SUBMODULE_NAME="${SUBMODULE_NAME%.path}"
            SUBMODULE_URL="$(git config -f .gitmodules --get "submodule.${SUBMODULE_NAME}.url" || true)"

            if [ -z "$SUBMODULE_URL" ]; then
              echo "❌ ERROR: Missing URL for submodule path '$SUBMODULE_PATH'."
              CHECK_FAILED=1
              continue
            fi

            PINNED_SHA="$(git rev-parse "HEAD:${SUBMODULE_PATH}" 2>/dev/null || true)"
            if [ -z "$PINNED_SHA" ]; then
              echo "❌ ERROR: Could not resolve pinned commit for '$SUBMODULE_PATH' in HEAD."
              CHECK_FAILED=1
              continue
            fi

            REMOTE_URL="$SUBMODULE_URL"
            if [[ "$SUBMODULE_URL" == https://github.com/* ]] && [ -n "${BOT_PAT:-}" ]; then
              REMOTE_URL="https://x-access-token:${BOT_PAT}@${SUBMODULE_URL#https://}"
            fi

            MAIN_SHA="$(git ls-remote "$REMOTE_URL" refs/heads/main | awk 'NR==1 { print $1 }')"
            if [ -z "$MAIN_SHA" ]; then
              echo "❌ ERROR: Could not resolve remote main SHA for '$SUBMODULE_PATH'."
              CHECK_FAILED=1
              continue
            fi

            if [ "$PINNED_SHA" != "$MAIN_SHA" ]; then
              echo "❌ ERROR: '$SUBMODULE_PATH' is not on latest main."
              echo "   pinned: $PINNED_SHA"
              echo "   main:   $MAIN_SHA"
              CHECK_FAILED=1
            else
              echo "✅ '$SUBMODULE_PATH' matches latest main ($MAIN_SHA)."
            fi
          done <<< "$FRONTEND_ENTRIES"

          if [ "$CHECK_FAILED" -ne 0 ]; then
            echo "One or more frontend submodules are not pinned to latest main."
            exit 1
          fi

