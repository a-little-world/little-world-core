# Open-Chat issue planning: when <bot-user> is assigned to an issue by the
# allowed author, a plan-mode agent on the Open-Chat server investigates the
# issue and posts a full plan as an issue comment.
# Implementation (reusable workflow) lives in msgmate-io/open-chat-go; see
# docs/open-chat-ci.md for configuration instructions.
name: Open-Chat Issue Plan

on:
  issues:
    types:
      - assigned

permissions:
  contents: read
  issues: write

jobs:
  open-chat-issue-plan:
    name: Open-Chat Issue Plan
    uses: msgmate-io/open-chat-go/.github/workflows/reusable-open-chat-issue-plan.yaml@main
    with:
      bot_user: ${{ vars.OPEN_CHAT_BOT_GITHUB_USER }}
      allowed_author: ${{ vars.OPEN_CHAT_ALLOWED_AUTHOR }}
      # Multiple allowed authors: assignments by any of these users trigger
      # a plan interaction on the Open-Chat server.
      allowed_authors: "tbscode,Simba14,JannisToelle"
      host: ${{ vars.OPEN_CHAT_HOST }}
      # plan_bot is omitted by design: the reusable workflow resolves it to
      # '<repo>-plan-bot' (little-world-backend-plan-bot), which must exist on
      # the Open-Chat server. See docs/open-chat-ci.md / dev/docs/open_chat_ci.md.
    secrets:
      OPEN_CHAT_API_TOKEN: ${{ secrets.OPEN_CHAT_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
