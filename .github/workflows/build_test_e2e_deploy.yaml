name: Test (api/e2e) & Deploy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: ${{ github.event.pull_request.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  no_labels_guidance:
    runs-on: ubuntu-latest
    name: Label Guidance
    if: github.event.pull_request.head.ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'deploy') && !contains(github.event.pull_request.labels.*.name, 'test') && !contains(github.event.pull_request.labels.*.name, 'e2e') && !contains(github.event.pull_request.labels.*.name, 'android')
    steps:
      - name: Delete previous workflow progress comments
        run: |
          comments=$(curl -s -H "Authorization: token ${{ secrets.BOT_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            | jq -r '.[] | select(.user.login=="littleworld-bot") | select((.body | contains("<!-- lw-staging-workflow -->")) or (.body | contains("<!-- lw-staging-no-label-guidance -->"))) | .id')
          for comment in $comments
          do
            curl -s -H "Authorization: token ${{ secrets.BOT_PAT }}" -X DELETE https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment
          done
      - name: Post no-label guidance comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- lw-staging-no-label-guidance -->"
          edit-mode: replace
          body: |
            Hello there 🙂 if you add labels, I'll do things:

            - `deploy`: deploy a test server
            - `test`: run the django backend tests
            - `e2e`: run the end to end tests

            I'll only allow workflows to merge that have passed `e2e` and `test` ( only admin may bypass this rule ).

            <!-- lw-staging-no-label-guidance -->
      - name: Fail when no labels selected
        run: |
          echo "❌ No action labels set (deploy/test/e2e/android)."
          exit 1

  # One image build, then N parallel deterministic test shards, then deploy/e2e.
  # The `finalize` job keeps the canonical `Test (api/e2e) & Deploy` check name so
  # the merge gate and existing branch protection keep working.
  prepare-build:
    runs-on: ubuntu-latest
    name: Setup & Build
    if: contains(github.event.pull_request.labels.*.name, 'deploy') || contains(github.event.pull_request.labels.*.name, 'test') || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'android')
    outputs:
      pull_number: ${{ steps.determine_pull_id.outputs.PULL_NUMBER }}
      branch: ${{ steps.extract_branch.outputs.branch }}
      sanitized_branch: ${{ steps.sanitize_branch.outputs.sanitized_branch }}
      should_run_tests: ${{ steps.determine_pull_id.outputs.SHOULD_RUN_TESTS }}
      should_run_e2e: ${{ steps.determine_pull_id.outputs.SHOULD_RUN_E2E }}
      should_deploy: ${{ steps.determine_pull_id.outputs.SHOULD_DEPLOY }}
      image_url: ${{ steps.setup_emperial_env.outputs.IMAGE_URL }}
      namespace: ${{ steps.setup_emperial_env.outputs.NAMESPACE }}
      redis_url: ${{ steps.setup_emperial_env.outputs.REDIS_URL }}
      redis_host: ${{ steps.setup_emperial_env.outputs.DJ_REDIS_HOST }}
      redis_port: ${{ steps.setup_emperial_env.outputs.DJ_REDIS_PORT }}
      testing: ${{ steps.setup_emperial_env.outputs.TESTING }}
      dj_create_open_chat_automation_user: ${{ steps.setup_emperial_env.outputs.DJ_CREATE_OPEN_CHAT_AUTOMATION_USER }}
      dj_open_chat_automation_user_email: ${{ steps.setup_emperial_env.outputs.DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL }}
      dj_open_chat_automation_user_password: ${{ steps.setup_emperial_env.outputs.DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD }}
      build_duration: ${{ steps.execution_time.outputs.DURATION }}
      comment_id: ${{ steps.create_comment.outputs.comment-id }}
    steps:
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.BOT_PAT }}
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read main_frontend submodule commit
        id: main_frontend_commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "front/apps/main_frontend/.git" ] || git -C front/apps/main_frontend rev-parse --git-dir >/dev/null 2>&1; then
            SHA=$(git -C front/apps/main_frontend rev-parse HEAD)
            echo "sha=$SHA" >> $GITHUB_OUTPUT
            echo "MAIN_FRONTEND_REPO_COMMIT_REF=$SHA" >> $GITHUB_ENV
          else
            echo "front/apps/main_frontend not a git repo; leaving empty" >&2
            echo "sha=" >> $GITHUB_OUTPUT
          fi
      - name: Extract branch name
        shell: bash
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Sanitize branch name for hostname
        shell: bash
        run: |
          # Validate branch name, convert determinsticly if required
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          SANITIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]')
          SANITIZED=$(echo "$SANITIZED" | sed 's/[^a-z0-9.-]/-/g')
          SANITIZED=$(echo "$SANITIZED" | sed 's/-\+/-/g' | sed 's/\.\+/./g')
          SANITIZED=$(echo "$SANITIZED" | sed 's/^[.-]\+//;s/[.-]\+$//')
          if [ -z "$SANITIZED" ]; then
            SANITIZED="branch"
          fi
          if ! echo "$SANITIZED" | grep -q '^[a-z0-9]'; then
            SANITIZED="b${SANITIZED}"
          fi
          if ! echo "$SANITIZED" | grep -q '[a-z0-9]$'; then
            SANITIZED="${SANITIZED}e"
          fi
          SANITIZED=$(echo "$SANITIZED" | cut -c1-63)
          SANITIZED=$(echo "$SANITIZED" | sed 's/[.-]\+$//')
          if [ -z "$SANITIZED" ] || ! echo "$SANITIZED" | grep -q '[a-z0-9]$'; then
            # If empty or doesn't end with alphanumeric, append 'e'
            SANITIZED="${SANITIZED}e"
            # Re-truncate if needed
            SANITIZED=$(echo "$SANITIZED" | cut -c1-63)
          fi
          echo "sanitized_branch=$SANITIZED" >> $GITHUB_OUTPUT
        id: sanitize_branch
      - name: Determine Pull ID and label-based actions
        id: determine_pull_id
        run: |
          pull_number=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          # Determine if the PR currently has the 'deploy' label
          SHOULD_DEPLOY=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -x 'deploy' || true)
          # Determine if the PR currently has the 'android' label
          SHOULD_BUILD_ANDROID=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -x 'android' || true)
          # Determine if the PR currently has the 'test' label
          SHOULD_RUN_TESTS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -x 'test' || true)
          # Determine if the PR currently has the 'e2e' label
          SHOULD_RUN_E2E=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep -x 'e2e' || true)
          echo "SHOULD_DEPLOY=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "SHOULD_BUILD_ANDROID=$SHOULD_BUILD_ANDROID" >> $GITHUB_OUTPUT
          echo "SHOULD_RUN_TESTS=$SHOULD_RUN_TESTS" >> $GITHUB_OUTPUT
          echo "SHOULD_RUN_E2E=$SHOULD_RUN_E2E" >> $GITHUB_OUTPUT
          echo "PULL_NUMBER=$pull_number" >> $GITHUB_OUTPUT
      - name: Prepare Android section content
        id: android_section
        run: |
          BADGE_URL="https://github.com/a-little-world/little-world-native/actions/workflows/android-apk-release.yml/badge.svg?branch=main"
          RUNS_URL="https://github.com/a-little-world/little-world-native/actions/workflows/android-apk-release.yml?query=event%3Aworkflow_dispatch"
          if [ -n "${{ steps.determine_pull_id.outputs.SHOULD_BUILD_ANDROID }}" ]; then
            {
              echo "section<<EOF"
              echo "### Android build"
              echo ""
              echo "[![Workflow status]($BADGE_URL)]($RUNS_URL)"
              echo ""
              echo "Triggered by label 'android'."
              echo "Tag: apk-${{ steps.main_frontend_commit.outputs.sha }}"
              echo "Commit: ${{ steps.main_frontend_commit.outputs.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "section<<EOF"
              echo "### Android build"
              echo ""
              echo "Status: not triggered"
              echo ""
              echo "Add the 'android' label to this PR to trigger a build."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Android App build
        env:
          COMMIT_REF: ${{ github.sha }}
        if: steps.extract_branch.outputs.branch != 'main' && steps.determine_pull_id.outputs.SHOULD_BUILD_ANDROID != ''
        run: |
          # Triggers the build in a seperate workflow
          STAGING_HOST="${{ steps.sanitize_branch.outputs.sanitized_branch }}-${{ steps.determine_pull_id.outputs.PULL_NUMBER }}.t1m.me"
          export MAIN_FRONTEND_REPO_COMMIT_REF="${{ steps.main_frontend_commit.outputs.sha }}"
          export TAG="apk-${{ steps.main_frontend_commit.outputs.sha }}"
          export NAME="apk-${{ steps.main_frontend_commit.outputs.sha }}"
          export PRERELEASE="true"
          export BOT_PAT="${{ secrets.BOT_PAT }}"
          export BASE_URL="https://${STAGING_HOST}"
          curl -X POST \
            -H "Authorization: Bearer ${BOT_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/a-little-world/little-world-native/actions/workflows/android-apk-release.yml/dispatches \
            -d '{"ref":"main","inputs":{"tag":"'"${TAG}"'","name":"'"${NAME}"'","prerelease":"'"${PRERELEASE}"'","baseUrl":"'"${BASE_URL}"'","COMMIT_REF":"'"${MAIN_FRONTEND_REPO_COMMIT_REF}"'"}}'
      - name: Delete all littleworld-bot comments
        run: |
          comments=$(curl -s -H "Authorization: token ${{ secrets.BOT_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.determine_pull_id.outputs.PULL_NUMBER }}/comments \
            | jq -r '.[] | select(.user.login=="littleworld-bot") | select(.body | contains("<!-- lw-staging-workflow -->")) | .id')
          for comment in $comments
          do
            curl -s -H "Authorization: token ${{ secrets.BOT_PAT }}" -X DELETE https://api.github.com/repos/${{ github.repository }}/issues/comments/$comment
          done
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v4
        id: create_comment
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        with:
          token: ${{ secrets.BOT_PAT }}
          issue-number: ${{ steps.determine_pull_id.outputs.PULL_NUMBER }}
          body: |
            running tests and deployment for you 🙂

            <!-- lw-staging-workflow -->

            - [ ] `(1) 'setup'` [`run`](${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }})
            - [ ] `(2) 'build' t=<build-time-loading>`
            ${{ steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' && '- [ ] `(3) ''deploy'' url=<deployment-url-loading>`' || '- [ ] ~~`(3) ''deploy'' url=<deployment-url-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '' && '- [ ] `(4) ''test''` `loading` `t=<test-time-loading>`' || '- [ ] ~~`(4) ''test'' t=<test-time-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_E2E != '' && '- [ ] `(5) ''e2e''` `loading` `t=<e2e-time-loading>`' || '- [ ] ~~`(5) ''e2e'' t=<e2e-time-loading>`~~' }}
      - name: Setup Emperial Env
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        id: setup_emperial_env
        run: |
          touch .env
          RANDOM_STRING="$( openssl rand -hex 3 )"
          IMAGE_URL="ghcr.io/a-little-world/little-world-backend/littleworld-epherial-backend:tmp-${{ steps.determine_pull_id.outputs.PULL_NUMBER }}-$RANDOM_STRING"
          touch .env; rm .env; touch .env
          echo "APP_IMAGE_URL=\"$IMAGE_URL\"" >> .env
          NAMESPACE="lw-tmp-env-${{ steps.determine_pull_id.outputs.PULL_NUMBER }}"
          REDIS_URL="redis://redis-service.$NAMESPACE.svc.cluster.local:6379"
          DJ_REDIS_HOST="redis-service.$NAMESPACE.svc.cluster.local"
          DJ_REDIS_PORT="6379"
          COOKIE_BANNER_BACKEND_URL="https://${{ steps.sanitize_branch.outputs.sanitized_branch }}-${{ steps.determine_pull_id.outputs.PULL_NUMBER }}.t1m.me"
          DJ_CREATE_OPEN_CHAT_AUTOMATION_USER="true"
          DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL="tim+open-chat@little-world.com"
          DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD="Test123!"
          TESTING="false"
          if [ -n "${{ steps.determine_pull_id.outputs.SHOULD_RUN_TESTS }}" ] || [ -n "${{ steps.determine_pull_id.outputs.SHOULD_RUN_E2E }}" ]; then
            TESTING="true"
          fi
          echo "REDIS_URL=\"$REDIS_URL\"" >> .env
          echo "DJ_REDIS_HOST=\"$DJ_REDIS_HOST\"" >> .env
          echo "DJ_REDIS_PORT=\"$DJ_REDIS_PORT\"" >> .env
          # Build production frontend assets while running the E2E backend in development mode.
          echo "BUILD_TYPE=\"production\"" >> .env
          echo "COOKIE_BANNER_BACKEND_URL=\"$COOKIE_BANNER_BACKEND_URL\"" >> .env
          echo "ENTRYPOINT=\"./entry.sh\"" >> .env
          echo "DJ_CREATE_OPEN_CHAT_AUTOMATION_USER=\"$DJ_CREATE_OPEN_CHAT_AUTOMATION_USER\"" >> .env
          echo "DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL=\"$DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL\"" >> .env
          echo "DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD=\"$DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD\"" >> .env
          echo "TESTING=\"$TESTING\"" >> .env
          # Keep CI build images lean: do not include development-only dependencies.
          echo "DEVELOPMENT=false" >> .env
          echo "REDIS_URL=$REDIS_URL" >> $GITHUB_OUTPUT
          echo "DJ_REDIS_HOST=$DJ_REDIS_HOST" >> $GITHUB_OUTPUT
          echo "DJ_REDIS_PORT=$DJ_REDIS_PORT" >> $GITHUB_OUTPUT
          echo "DJ_CREATE_OPEN_CHAT_AUTOMATION_USER=$DJ_CREATE_OPEN_CHAT_AUTOMATION_USER" >> $GITHUB_OUTPUT
          echo "DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL=$DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL" >> $GITHUB_OUTPUT
          echo "DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD=$DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD" >> $GITHUB_OUTPUT
          echo "TESTING=$TESTING" >> $GITHUB_OUTPUT
          echo "RANDOM_STRING=$RANDOM_STRING" >> $GITHUB_OUTPUT
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_OUTPUT
      - name: Add build step comment
        uses: peter-evans/create-or-update-comment@v4
        id: update_comment
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        with:
          token: ${{ secrets.BOT_PAT }}
          comment-id: ${{ steps.create_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            running tests and deployment for you 🙂

            <!-- lw-staging-workflow -->

            - [x] `(1) 'setup'` [`run`](${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }})
            - [ ] `(2) 'build' t=<build-time-loading>`
            ${{ steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' && '- [ ] `(3) ''deploy'' url=<deployment-url-loading>`' || '- [ ] ~~`(3) ''deploy'' url=<deployment-url-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '' && '- [ ] `(4) ''test''` `loading` `t=<test-time-loading>`' || '- [ ] ~~`(4) ''test'' t=<test-time-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_E2E != '' && '- [ ] `(5) ''e2e''` `loading` `t=<e2e-time-loading>`' || '- [ ] ~~`(5) ''e2e'' t=<e2e-time-loading>`~~' }}
      - name: Measure start time
        id: start
        run: |
          echo "time=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Build Image
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        run: |
          echo ${{ secrets.BOT_PAT }} | docker login ghcr.io -u littleworld-bot --password-stdin
          # use the ci compose instead of the development one
          mv dev/ci/docker-compose.ci.yaml docker-compose.yaml
          DOCKER_BUILDKIT=1 docker compose build
          DOCKER_BUILDKIT=1 docker compose push
      - name: Measure end time
        id: end
        run: |
          echo "time=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Calculate execution time
        id: execution_time
        run: |
          START=${{ steps.start.outputs.time }}
          END=${{ steps.end.outputs.time }}
          DIFF=$(( END - START ))
          echo "DURATION=$DIFF" >> $GITHUB_OUTPUT
      - name: Add build step comment 2
        uses: peter-evans/create-or-update-comment@v4
        id: update_comment_2
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        with:
          token: ${{ secrets.BOT_PAT }}
          comment-id: ${{ steps.create_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            running tests and deployment for you 🙂

            <!-- lw-staging-workflow -->

            - [x] `(1) 'setup'` [`run`](${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }})
            - [x] `(2) 'build' t=${{ steps.execution_time.outputs.DURATION }}s`
            ${{ steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' && '- [ ] `(3) ''deploy'' url=<deployment-url-loading>`' || '- [ ] ~~`(3) ''deploy'' url=<deployment-url-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '' && '- [ ] `(4) ''test''` `loading` `t=<test-time-loading>`' || '- [ ] ~~`(4) ''test'' t=<test-time-loading>`~~' }}
            ${{ steps.determine_pull_id.outputs.SHOULD_RUN_E2E != '' && '- [ ] `(5) ''e2e''` `loading` `t=<e2e-time-loading>`' || '- [ ] ~~`(5) ''e2e'' t=<e2e-time-loading>`~~' }}
      - name: Upload CI env artifact
        if: steps.extract_branch.outputs.branch != 'main' && (steps.determine_pull_id.outputs.SHOULD_DEPLOY != '' || steps.determine_pull_id.outputs.SHOULD_RUN_TESTS != '')
        uses: actions/upload-artifact@v4
        with:
          name: ci-env
          path: .env
          include-hidden-files: true
          if-no-files-found: error

  django-tests:
    needs: prepare-build
    name: Django Tests (${{ matrix.shard }}/${{ matrix.total }})
    if: needs.prepare-build.outputs.should_run_tests != ''
    runs-on: ubuntu-latest
    strategy:
      # Every shard must report its result, so never cancel the others on failure.
      fail-fast: false
      matrix:
        # Bump `total` and the `shard` list together; also update the shard log
        # count check in `finalize` if you change the number of shards.
        total: [6]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.BOT_PAT }}
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download CI env artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-env
      - name: Prepare CI compose file
        run: |
          set -euo pipefail
          mv dev/ci/docker-compose.ci.yaml docker-compose.yaml
          # Tests run against the compose-internal redis service, not the cluster one.
          sed -i '/^REDIS_URL/d' .env
          sed -i '/^DJ_REDIS_HOST/d' .env
          sed -i '/^DJ_REDIS_PORT/d' .env
          echo 'REDIS_URL="redis://redis:6379"' >> .env
          echo 'DJ_REDIS_HOST="redis"' >> .env
          echo 'DJ_REDIS_PORT="6379"' >> .env
      - name: Pull CI images
        run: |
          set -euo pipefail
          echo ${{ secrets.BOT_PAT }} | docker login ghcr.io -u littleworld-bot --password-stdin
          docker compose pull all redis
      - name: Run django tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        id: run_tests
        run: |
          set -euo pipefail
          LOG_FILE="test_output_shard_${{ matrix.shard }}.log"
          : > "$LOG_FILE"
          docker compose up redis -d
          set +e
          docker compose run -T \
            -e DJ_TEST_SHARDS=${{ matrix.total }} \
            -e DJ_TEST_SHARD=${{ matrix.shard }} \
            all python manage.py test \
              --testrunner=back.sharded_test_runner.ShardedDiscoverRunner \
              --durations 25 2>&1 | tee -a "$LOG_FILE"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          docker compose down redis || true
          exit $TEST_EXIT
      - name: Upload shard log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-log-shard-${{ matrix.shard }}
          path: test_output_shard_${{ matrix.shard }}.log
          if-no-files-found: ignore

  deploy-e2e:
    needs: prepare-build
    name: Deploy & E2E
    if: needs.prepare-build.outputs.should_deploy != '' || needs.prepare-build.outputs.should_run_e2e != ''
    runs-on: ubuntu-latest
    outputs:
      staging_url: ${{ steps.cluster_connection.outputs.STAGING_URL }}
      e2e_result: ${{ steps.run_e2e_tests.outputs.test_result }}
      e2e_duration: ${{ steps.execution_time_e2e_tests.outputs.DURATION }}
    steps:
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.BOT_PAT }}
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download CI env artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-env
      - name: Prepare CI compose file
        run: |
          set -euo pipefail
          mv dev/ci/docker-compose.ci.yaml docker-compose.yaml
          # The deployed cluster uses the k8s redis from the workflow outputs via helm;
          # the compose-based e2e run uses the compose-internal redis service.
          sed -i '/^REDIS_URL/d' .env
          sed -i '/^DJ_REDIS_HOST/d' .env
          sed -i '/^DJ_REDIS_PORT/d' .env
          echo 'REDIS_URL="redis://redis:6379"' >> .env
          echo 'DJ_REDIS_HOST="redis"' >> .env
          echo 'DJ_REDIS_PORT="6379"' >> .env
          echo ${{ secrets.BOT_PAT }} | docker login ghcr.io -u littleworld-bot --password-stdin
          docker compose pull all redis
      - uses: azure/setup-helm@v4.3.0
        if: needs.prepare-build.outputs.should_deploy != ''
        with:
          version: "latest"
          token: ${{ secrets.BOT_PAT }}
        id: install-helm
      - uses: azure/setup-kubectl@v3
        if: needs.prepare-build.outputs.should_deploy != ''
        with:
          version: "latest"
        id: install-kubectl
      - name: Clone Helm Repository
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_deploy != ''
        uses: actions/checkout@main
        with:
          repository: a-little-world/little-world-helm-chart
          token: ${{ secrets.BOT_PAT }}
          ref: main
          path: helm
      - name: Setup Cluster Connection
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_deploy != ''
        id: cluster_connection
        run: |
          echo "${{ secrets.ENCRYPTED_KUBE_CONFIG_BASE64 }}" | base64 --decode > kubeconfig.enc
          openssl aes-256-cbc -d -pbkdf2 -in ./kubeconfig.enc -out kubeconfig.yaml -k ${{ secrets.KUBE_CONFIG_PASSWORD }}
          GH_CR_AUTH=$(echo -n "littleworld-bot:${{ secrets.BOT_PAT }}" | base64)
          STAGING_HOST="${{ needs.prepare-build.outputs.sanitized_branch }}-${{ needs.prepare-build.outputs.pull_number }}.t1m.me"
          STAGING_URL="https://$STAGING_HOST"
          cat << EOF | while read eval_command; do yq -i eval "$eval_command" ./helm/values.yaml; done
            .rootNamespace = "${{ needs.prepare-build.outputs.namespace }}"
            .backend.imageURL = "${{ needs.prepare-build.outputs.image_url }}"
            .ingress.certManager = true
            .ingress.host = "$STAGING_HOST"
            .registryAuth.token = "$GH_CR_AUTH"
            .registryAuth.use = true
            .backend.celery.workerConcurrency = "1"
            .backend.resources.requests.memory = "256Mi"
            .backend.resources.limits.memory = "1Gi"
            .backend.env.REDIS_URL = "${{ needs.prepare-build.outputs.redis_url }}"
            .backend.env.DJ_REDIS_HOST = "${{ needs.prepare-build.outputs.redis_host }}"
            .backend.env.DJ_REDIS_PORT = "${{ needs.prepare-build.outputs.redis_port }}"
            .backend.env.DJ_CREATE_OPEN_CHAT_AUTOMATION_USER = "${{ needs.prepare-build.outputs.dj_create_open_chat_automation_user }}"
            .backend.env.DJ_OPEN_CHAT_AUTOMATION_USER_EMAIL = "${{ needs.prepare-build.outputs.dj_open_chat_automation_user_email }}"
            .backend.env.DJ_OPEN_CHAT_AUTOMATION_USER_PASSWORD = "${{ needs.prepare-build.outputs.dj_open_chat_automation_user_password }}"
          EOF
          NAMESPACE=lw-tmp-env-${{ needs.prepare-build.outputs.pull_number }}
          KUBECONFIG=./kubeconfig.yaml kubectl create namespace $NAMESPACE || true
          KUBECONFIG=./kubeconfig.yaml helm upgrade --install backend-tmp-${{ needs.prepare-build.outputs.pull_number }} ./helm
          echo "STAGING_URL=$STAGING_URL" >> $GITHUB_OUTPUT
      - name: Add build step comment 3
        uses: peter-evans/create-or-update-comment@v4
        id: update_comment_3
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_deploy != ''
        with:
          token: ${{ secrets.BOT_PAT }}
          comment-id: ${{ needs.prepare-build.outputs.comment_id }}
          edit-mode: replace
          body: |
            running tests and deployment for you 🙂

            <!-- lw-staging-workflow -->

            - [x] `(1) 'setup'` [`run`](${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }})
            - [x] `(2) 'build' t=${{ needs.prepare-build.outputs.build_duration }}s`
            - [x] `(3) 'deploy'` [`url=${{ steps.cluster_connection.outputs.STAGING_URL }}`](${{ steps.cluster_connection.outputs.STAGING_URL }})
            ${{ needs.prepare-build.outputs.should_run_tests != '' && '- [ ] `(4) ''test''` `running` `t=<test-time-loading>`' || '- [ ] ~~`(4) ''test'' t=<test-time-loading>`~~' }}
            ${{ needs.prepare-build.outputs.should_run_e2e != '' && '- [ ] `(5) ''e2e''` `running` `t=<e2e-time-loading>`' || '- [ ] ~~`(5) ''e2e'' t=<e2e-time-loading>`~~' }}
      - name: Notify Slack Channel
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_deploy != ''
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          CHANNEL_ID: "C0695SSFPMM"
          MESSAGE: "*Feature environment deployed*\nImage: ${{ needs.prepare-build.outputs.image_url }}\nUrl ${{ steps.cluster_connection.outputs.STAGING_URL }}"
        run: |
          pip3 install slack_sdk
          wget -qO- https://raw.githubusercontent.com/tbscode/tims-blog-posts/main/assets/send_slack_message.py | python3 -
      - name: Measure start time e2e tests
        id: start_e2e_tests
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        run: |
          echo "time=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Run e2e simulation tests
        id: run_e2e_tests
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        env:
          # Wall-clock cap for compose + readiness wait + simulations (GNU timeout exit 124 = exceeded).
          E2E_STEP_TIMEOUT_SEC: "500"
        run: |
          set -euo pipefail
          # Enable test-only dev API endpoints for e2e flows.
          export CI="true"
          export DJANGO_TESTING="true"
          export DJ_ENABLE_E2E_TEST_APIS="true"
          cleanup() {
            docker compose logs --no-color all redis > e2e_services.log 2>&1 || true
            docker compose down all redis || true
          }
          trap cleanup EXIT
          E2E_STEP_TIMEOUT_SEC="${E2E_STEP_TIMEOUT_SEC:-500}"
          set +e
          timeout --kill-after=120 "$E2E_STEP_TIMEOUT_SEC" bash <<'E2E_INNER'
          set -euo pipefail
          docker compose up -d redis all
          echo "Waiting for backend readiness on http://127.0.0.1:8000/login ..."
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8000/login" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend did not become ready in time"
            docker compose ps || true
            exit 1
          fi
          LOG_FILE="e2e_test_output.log"
          : > "$LOG_FILE"
          set +e
          set -o pipefail
          E2E_BASE_URL="http://127.0.0.1:8000" bash dev/e2e_simulations/run.sh 2>&1 | tee -a "$LOG_FILE"
          exit "${PIPESTATUS[0]}"
          E2E_INNER
          TEST_EXIT=$?
          set -e
          if [ "$TEST_EXIT" -eq 124 ]; then
            echo "E2E step exceeded wall-clock limit (${E2E_STEP_TIMEOUT_SEC}s)" >&2
            echo "test_result=fail" >> "$GITHUB_OUTPUT"
          elif [ "$TEST_EXIT" -eq 0 ]; then
            echo "test_result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "test_result=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure end time e2e tests
        id: end_e2e_tests
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        run: |
          echo "time=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Calculate execution time e2e tests
        id: execution_time_e2e_tests
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        run: |
          START=${{ steps.start_e2e_tests.outputs.time }}
          END=${{ steps.end_e2e_tests.outputs.time }}
          DIFF=$(( END - START ))
          echo "DURATION=$DIFF" >> $GITHUB_OUTPUT
      - name: Upload e2e test log artifact
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-log
          path: e2e_test_output.log
          if-no-files-found: ignore
      - name: Upload e2e service log artifact
        if: needs.prepare-build.outputs.branch != 'main' && needs.prepare-build.outputs.should_run_e2e != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-log
          path: e2e_services.log
          if-no-files-found: ignore

  finalize:
    needs: [prepare-build, django-tests, deploy-e2e]
    name: Test (api/e2e) & Deploy
    if: >-
      always()
      && github.event.pull_request.head.ref != 'main'
      && (contains(github.event.pull_request.labels.*.name, 'deploy')
      || contains(github.event.pull_request.labels.*.name, 'test')
      || contains(github.event.pull_request.labels.*.name, 'e2e')
      || contains(github.event.pull_request.labels.*.name, 'android'))
    runs-on: ubuntu-latest
    steps:
      - name: Download django shard logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: django-test-log-shard-*
          path: test-logs
          merge-multiple: true
      - name: Download e2e test log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-log
          path: e2e-logs
      - name: Download e2e service log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-service-log
          path: e2e-logs
      - name: Combine shard logs and check partition completeness
        id: completeness
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p test-logs
          : > test_output.log
          shard_count=0
          for log in $(ls test-logs/test_output_shard_*.log 2>/dev/null | sort -V); do
            cat "$log" >> test_output.log
            shard_count=$(( shard_count + 1 ))
          done
          echo "downloaded shard logs: $shard_count"
          # Each shard logs the true full-suite total (DiscoverRunner prints it before filtering).
          found_values=$(grep -hoE 'Found [0-9]+ test' test-logs/*.log 2>/dev/null | grep -oE '[0-9]+' | sort -u || true)
          found_count=$(printf '%s\n' "$found_values" | sed '/^$/d' | wc -l)
          found=$(printf '%s\n' "$found_values" | sed '/^$/d' | head -1)
          ran=$(grep -hoE '^Ran [0-9]+ tests' test-logs/*.log 2>/dev/null | awk '{s+=$2} END{print s+0}')
          echo "found=$found ran=$ran"
          if [ "$shard_count" -lt 1 ] || [ "$found_count" -ne 1 ] || [ "$ran" != "$found" ]; then
            echo "❌ shard partition mismatch (logs=$shard_count found=['$found_values'] ran=$ran)"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Summarize shard results
        id: test_stats
        if: always()
        run: |
          set -euo pipefail
          status="pass"
          duration="0"
          per_shard=""
          for log in $(ls test-logs/test_output_shard_*.log 2>/dev/null | sort -V); do
            shard=$(basename "$log" | grep -oE '[0-9]+' | head -1)
            if grep -qE '^FAILED' "$log"; then
              mark="failed"; status="fail"
            elif grep -qE '^OK' "$log"; then
              mark="success"
            else
              mark="no-result"; status="fail"
            fi
            t=$(grep -E '^Ran [0-9]+ tests' "$log" | tail -1 | awk '{print $NF}' | tr -d 's')
            t=${t:-0}
            duration=$(awk -v a="$duration" -v b="$t" 'BEGIN{printf "%.0f", (b+0>a+0)?b:a}')
            per_shard="${per_shard}shard ${shard}: ${mark} (${t}s); "
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "per_shard=$per_shard" >> "$GITHUB_OUTPUT"
      - name: Prepare django test log snippet
        id: test_log_snippet
        if: always()
        run: |
          SNIPPET="$(tail -n 400 test_output.log 2>/dev/null || echo 'No django test output captured.')"
          {
            echo "snippet<<EOF"
            echo "$SNIPPET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare e2e test log snippet
        id: e2e_test_log_snippet
        if: always()
        run: |
          SNIPPET="$(tail -n 400 e2e-logs/e2e_test_output.log 2>/dev/null || echo 'No e2e test output captured.')"
          {
            echo "snippet<<EOF"
            echo "$SNIPPET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Compose consolidated comment
        if: always()
        env:
          BUILD_DURATION: ${{ needs.prepare-build.outputs.build_duration }}
          SHOULD_DEPLOY: ${{ needs.prepare-build.outputs.should_deploy }}
          SHOULD_RUN_TESTS: ${{ needs.prepare-build.outputs.should_run_tests }}
          SHOULD_RUN_E2E: ${{ needs.prepare-build.outputs.should_run_e2e }}
          STAGING_URL: ${{ needs.deploy-e2e.outputs.staging_url }}
          E2E_RESULT: ${{ needs.deploy-e2e.outputs.e2e_result }}
          E2E_DURATION: ${{ needs.deploy-e2e.outputs.e2e_duration }}
          TEST_STATUS: ${{ steps.test_stats.outputs.status }}
          TEST_DURATION: ${{ steps.test_stats.outputs.duration }}
          TEST_PER_SHARD: ${{ steps.test_stats.outputs.per_shard }}
          TEST_SNIPPET: ${{ steps.test_log_snippet.outputs.snippet }}
          E2E_SNIPPET: ${{ steps.e2e_test_log_snippet.outputs.snippet }}
        run: |
          {
            echo "running tests and deployment for you 🙂"
            echo ""
            echo "<!-- lw-staging-workflow -->"
            echo ""
            echo "- [x] \`(1) 'setup'\` [\`run\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- [x] \`(2) 'build' t=${BUILD_DURATION}s\`"
            if [ -n "$SHOULD_DEPLOY" ]; then
              echo "- [x] \`(3) 'deploy'\` [\`url=${STAGING_URL}\`](${STAGING_URL})"
            else
              echo "- [ ] ~~\`(3) 'deploy' url=<deployment-url-loading>\`~~"
            fi
            if [ -n "$SHOULD_RUN_TESTS" ]; then
              echo "- [x] \`(4) 'test' ${TEST_STATUS} t=${TEST_DURATION}s\` — ${TEST_PER_SHARD}"
            else
              echo "- [ ] ~~\`(4) 'test' t=<test-time-loading>\`~~"
            fi
            if [ -n "$SHOULD_RUN_E2E" ]; then
              if [ "$E2E_RESULT" = "pass" ]; then
                echo "- [x] \`(5) 'e2e' success t=${E2E_DURATION}s\`"
              else
                echo "- [x] \`(5) 'e2e' failed t=${E2E_DURATION}s\`"
              fi
            else
              echo "- [ ] ~~\`(5) 'e2e' t=<e2e-time-loading>\`~~"
            fi
            echo ""
            echo "<details>"
            echo "<summary>Django test output (last 400 lines)</summary>"
            echo ""
            echo '```text'
            echo "$TEST_SNIPPET"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary>E2E test output (last 400 lines)</summary>"
            echo ""
            echo '```text'
            echo "$E2E_SNIPPET"
            echo '```'
            echo "</details>"
          } > final_comment.md
          cat final_comment.md
      - name: Update consolidated progress comment
        if: always() && needs.prepare-build.outputs.pull_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          issue-number: ${{ needs.prepare-build.outputs.pull_number }}
          body-includes: "<!-- lw-staging-workflow -->"
          body-path: final_comment.md
          edit-mode: replace
      - name: Enforce tests required for success
        if: always()
        run: |
          set -euo pipefail

          SHOULD_RUN_TESTS="${{ needs.prepare-build.outputs.should_run_tests }}"
          SHOULD_RUN_E2E="${{ needs.prepare-build.outputs.should_run_e2e }}"
          TEST_RESULT="${{ needs.django-tests.result }}"
          E2E_RESULT="${{ needs.deploy-e2e.outputs.e2e_result }}"
          PARTITION_COMPLETE="${{ steps.completeness.outputs.complete }}"

          if [ -z "$SHOULD_RUN_TESTS" ] || [ -z "$SHOULD_RUN_E2E" ]; then
            echo "❌ Both 'test' and 'e2e' labels are required for a passing run."
            exit 1
          fi

          if [ "$PARTITION_COMPLETE" != "true" ]; then
            echo "❌ Test shards did not collectively cover the full discovered suite."
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ] || [ "$E2E_RESULT" != "pass" ]; then
            echo "❌ Required tests did not pass."
            echo "test=$TEST_RESULT e2e=$E2E_RESULT"
            exit 1
          fi

          echo "✅ Both test and e2e ran and passed."