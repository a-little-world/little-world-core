name: Main Build, Publish & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-build-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, publish and test main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          submodules: recursive

      - name: Set up image env
        id: image
        run: |
          set -euo pipefail
          REPO="ghcr.io/a-little-world/little-world-backend/littleworld-backend"
          TAG="main-test-${GITHUB_SHA}"
          IMAGE="$REPO:$TAG"
          # Test image: ships the test dependencies so the suite runs in it.
          {
            echo "APP_IMAGE_URL=\"$IMAGE\""
            echo "BUILD_TYPE=\"production\""
            echo "ENTRYPOINT=\"./entry.sh\""
            echo "TESTING=true"
            echo "REDIS_URL=\"redis://redis:6379\""
            echo "DEVELOPMENT=false"
            echo "WEBPACK_PUBLIC_PATH=\"\""
          } > .env
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          set -euo pipefail
          echo "${{ secrets.BOT_PAT }}" | docker login ghcr.io -u littleworld-bot --password-stdin
          mv dev/ci/docker-compose.ci.yaml docker-compose.yaml
          DOCKER_BUILDKIT=1 docker compose build

      - name: Publish image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.image }}"
          REPO="${{ steps.image.outputs.repo }}"
          docker push "$IMAGE"
          docker tag "$IMAGE" "$REPO:main-test"
          docker push "$REPO:main-test"

      - name: Run django tests
        run: |
          set -euo pipefail
          docker compose up redis -d
          set +e
          docker compose run -T all python manage.py test 2>&1 | tee test_output.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          docker compose down redis
          exit "$TEST_EXIT"

      - name: Run e2e simulation tests
        env:
          E2E_STEP_TIMEOUT_SEC: "500"
        run: |
          set -euo pipefail
          # Test-only dev API endpoints are enabled through runtime env overrides.
          export CI="true"
          export DJANGO_TESTING="true"
          export DJ_ENABLE_E2E_TEST_APIS="true"
          cleanup() {
            docker compose logs --no-color all redis > e2e_services.log 2>&1 || true
            docker compose down all redis || true
          }
          trap cleanup EXIT
          E2E_STEP_TIMEOUT_SEC="${E2E_STEP_TIMEOUT_SEC:-500}"
          set +e
          timeout --kill-after=120 "$E2E_STEP_TIMEOUT_SEC" bash <<'E2E_INNER'
          set -euo pipefail
          docker compose up -d redis all
          echo "Waiting for backend readiness on http://127.0.0.1:8000/login ..."
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8000/login" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend did not become ready in time"
            docker compose ps || true
            exit 1
          fi
          set +e
          set -o pipefail
          E2E_BASE_URL="http://127.0.0.1:8000" bash dev/e2e_simulations/run.sh 2>&1 | tee e2e_test_output.log
          exit "${PIPESTATUS[0]}"
          E2E_INNER
          TEST_EXIT=$?
          set -e
          if [ "$TEST_EXIT" -eq 124 ]; then
            echo "E2E step exceeded wall-clock limit (${E2E_STEP_TIMEOUT_SEC}s)" >&2
          fi
          exit "$TEST_EXIT"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-test-logs
          path: |
            test_output.log
            e2e_test_output.log
            e2e_services.log
          if-no-files-found: ignore
