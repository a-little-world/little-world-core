name: sync_mirror

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync_mirror
  cancel-in-progress: false

env:
  MIRROR_REPO: a-little-world/little-world-core

jobs:
  sync_mirror:
    runs-on: ubuntu-latest
    name: Sync repository mirror
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_PAT }}

      - name: Configure git
        run: |
          git config user.name "littleworld-bot"
          git config user.email "littleworld-bot@users.noreply.github.com"

      - name: Restrict mirror to the main branch
        run: |
          # Only the main branch is mirrored. actions/checkout fetches every branch
          # as a remote-tracking ref; drop them and any other local branch so the
          # --mirror push publishes main (+ tags) and nothing else.
          git checkout -B main origin/main
          git for-each-ref --format='%(refname)' refs/remotes | while read -r ref; do
            git update-ref -d "$ref"
          done
          git for-each-ref --format='%(refname:short)' refs/heads | grep -vx main | while read -r branch; do
            git branch -D "$branch"
          done

      - name: Push exact mirror of main to ${{ env.MIRROR_REPO }}
        run: |
          git push --mirror --force \
            "https://${{ secrets.BOT_PAT }}@github.com/${MIRROR_REPO}.git"
