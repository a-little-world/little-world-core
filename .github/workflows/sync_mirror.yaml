name: sync_mirror

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync_mirror
  cancel-in-progress: false

env:
  MIRROR_REPO: a-little-world/little-world-core

jobs:
  sync_mirror:
    runs-on: ubuntu-latest
    name: Sync repository mirror
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_PAT }}

      - name: Configure git
        run: |
          git config user.name "littleworld-bot"
          git config user.email "littleworld-bot@users.noreply.github.com"

      - name: Promote fetched branches to local refs
        run: |
          # actions/checkout only fetches other branches as remote-tracking refs.
          # Promote them to real branches so the mirror is published one-to-one.
          git for-each-ref --format='%(refname:lstrip=3) %(objectname)' refs/remotes/origin | while read -r branch sha; do
            [ "$branch" = "HEAD" ] && continue
            git update-ref "refs/heads/$branch" "$sha"
          done
          git for-each-ref --format='%(refname)' refs/remotes | while read -r ref; do
            git update-ref -d "$ref"
          done

      - name: Remove internal .github folder from all branches
        run: |
          # Strip internal CI configuration from every commit so it never reaches the public mirror.
          git filter-branch --force --index-filter \
            "git rm -rf --cached --ignore-unmatch .github" \
            --prune-empty --tag-name-filter cat -- --all

      - name: Clean up rewritten refs
        run: |
          rm -rf .git/refs/original/
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

      - name: Verify .github is stripped
        run: |
          if git log --branches --tags --oneline -- .github | grep -q .; then
            echo "::error::.github is still present in the mirror history, refusing to publish"
            exit 1
          fi

      - name: Push one-to-one mirror to ${{ env.MIRROR_REPO }}
        run: |
          git push --mirror --force \
            "https://${{ secrets.BOT_PAT }}@github.com/${MIRROR_REPO}.git"
