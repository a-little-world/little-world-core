name: sync_mirror

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync_mirror
  cancel-in-progress: false

env:
  MIRROR_REPO: a-little-world/little-world-core
  MIRROR_BRANCH: source-repo
  MIRROR_BASE: main

jobs:
  sync_mirror:
    runs-on: ubuntu-latest
    name: Sync repository mirror
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BOT_PAT }}

      - name: Configure git
        run: |
          git config user.name "littleworld-bot"
          git config user.email "littleworld-bot@users.noreply.github.com"

      # main on the mirror is protected (repository ruleset blocks updates,
      # including force pushes), so we cannot mirror main directly. Instead we
      # publish source main to the unprotected MIRROR_BRANCH and let a human
      # review/merge the always-open pull request from MIRROR_BRANCH into main.
      - name: Push main to the mirror branch
        run: |
          git push --force \
            "https://${{ secrets.BOT_PAT }}@github.com/${MIRROR_REPO}.git" \
            "refs/heads/main:refs/heads/${MIRROR_BRANCH}"
          git push --force --prune \
            "https://${{ secrets.BOT_PAT }}@github.com/${MIRROR_REPO}.git" \
            "refs/tags/*:refs/tags/*"

      - name: Ensure the sync pull request is open
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          open_prs=$(gh pr list --repo "$MIRROR_REPO" \
            --head "$MIRROR_BRANCH" --base "$MIRROR_BASE" --state open \
            --json number --jq 'length')
          if [ "$open_prs" -gt 0 ]; then
            echo "Pull request ${MIRROR_BRANCH} -> ${MIRROR_BASE} is already open."
            exit 0
          fi
          if gh pr create --repo "$MIRROR_REPO" \
              --base "$MIRROR_BASE" --head "$MIRROR_BRANCH" \
              --title "Sync ${MIRROR_BRANCH} -> ${MIRROR_BASE}" \
              --body "Automated mirror of the public source repository. Review and merge to publish the latest main."; then
            echo "Created the sync pull request."
          else
            echo "::warning::Could not open a sync pull request (the branch may already be identical to ${MIRROR_BASE})."
          fi